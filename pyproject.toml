[project]
name = "businessllm-rag-chat"
version = "0.1.0"
description = ""
authors = [
    {name = "Tom Chang",email = "ckf30098@yahoo.com.tw"}
]
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "torch>=2.1.0",  
    "transformers>=4.38.0",
    "peft>=0.8.2",
    "accelerate>=0.28.0",
    "bitsandbytes>=0.43.0",
    "vllm>=0.4.0",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "huggingface-hub (>=0.33.4,<0.34.0)",
    "modal (>=1.1.0,<2.0.0)",  
]

[tool.poetry]
packages = [{include = "businessllm_rag_chat", from = "src"}]


[tool.poetry.group.data.dependencies]
boto3 = "^1.38.46"
requests = "^2.32.4"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
